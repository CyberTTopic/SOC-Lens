name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Comprobar librerías locales
        run: test -f vendor/xlsx.full.min.js && test -f vendor/chart.umd.min.js && test -f vendor/jspdf.umd.min.js
      - run: npm test

  publicar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar la app (HTML + librerías)
        run: zip -r "soc-lens-$GITHUB_REF_NAME.zip" index.html vendor
      - name: Calcular hashes
        run: sha256sum "soc-lens-$GITHUB_REF_NAME.zip" index.html > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "soc-lens-$GITHUB_REF_NAME.zip" index.html SHA256SUMS.txt --title "SOC Lens $GITHUB_REF_NAME" --generate-notes
