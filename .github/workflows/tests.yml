name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Comprobar librerías locales
        run: test -f vendor/xlsx.full.min.js && test -f vendor/chart.umd.min.js && test -f vendor/jspdf.umd.min.js
      - name: Pruebas
        run: npm test
